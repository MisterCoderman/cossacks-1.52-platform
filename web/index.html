<!doctype html>

<title>Cossacks: Back to War — 1.52</title>
<style>

    color:#e8dcc0; font-family:Georgia,'Times New Roman',serif;
    display:flex; align-items:center; justify-content:center; min-height:100vh;
  }
  .card{text-align:center; padding:2rem}

  .langs{display:flex; gap:1.4rem; justify-content:center; flex-wrap:wrap}

    box-shadow:0 4px 14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,240,200,.15);

  }

  a.lang .flag svg{width:3.6rem; height:auto; border-radius:3px;
     box-shadow:0 1px 4px rgba(0,0,0,.6); vertical-align:middle}

<body>
  <div class="card">

          <clipPath id="gbc"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
          <clipPath id="gbt"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
